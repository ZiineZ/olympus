# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission-policies
  namespace: flux-system
  annotations:
    olympus/description: Built-in ValidatingAdmissionPolicies (CEL) that enforce the workload standards at the API server.
    olympus/docs: 00-docs/conventions.md
    olympus/adr: "0021,0022,0031"
spec:
