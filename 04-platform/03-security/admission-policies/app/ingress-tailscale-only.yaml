# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicy-admissionregistration-v1.json
# The Ingress API is only for tailnet UIs (ingressClassName tailscale); everything else uses Gateway API (ADR-0011).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-tailscale-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  validations:
    - expression: "has(object.spec.ingressClassName) && object.spec.ingressClassName == 'tailscale'"
      messageExpression: "'only ingressClassName tailscale is allowed; public traffic uses the Gateway (ADR-0011)'"
---
# Warn + Audit first; strict policies switch to [Deny] in a follow-up PR after a week (ADR-0021 rule 4).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ingress-tailscale-only
spec:
  policyName: ingress-tailscale-only
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector: # exemptions: only namespaces whose objects upstream operators create (ADR-0031)
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system]
