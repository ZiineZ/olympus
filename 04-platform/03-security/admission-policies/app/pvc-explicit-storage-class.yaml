# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicy-admissionregistration-v1.json
# PVCs name their StorageClass (ADR-0016).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pvc-explicit-storage-class
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [persistentvolumeclaims]
  validations:
    - expression: "has(object.spec.storageClassName) && object.spec.storageClassName != ''"
      messageExpression: "'set spec.storageClassName explicitly, normally local-path (ADR-0016)'"
---
# Warn + Audit first; strict policies switch to [Deny] in a follow-up PR after a week (ADR-0021 rule 4).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pvc-explicit-storage-class
spec:
  policyName: pvc-explicit-storage-class
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector: # exemptions: only namespaces whose objects upstream operators create (ADR-0031)
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system]
