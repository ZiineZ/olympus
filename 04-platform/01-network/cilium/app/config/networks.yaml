# LoadBalancer IPs come from the pool reserved in ADR-0009 and are announced on the LAN with ARP.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: ${LB_POOL_START}
      stop: ${LB_POOL_END}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - ^e.* # wired NICs only (eth*, eno*, enp*): never tailscale or lxc/cilium devices
