# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
  annotations:
    olympus/description: Cloudflare Tunnel "olympus". The only way public traffic enters, outbound-only (no port forwarding).
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0011"
spec:
  interval: 10m
  path: ./04-platform/01-network/cloudflared/app
  targetNamespace: cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway
