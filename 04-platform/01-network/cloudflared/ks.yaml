# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
  annotations:
    olympus/description: Cloudflare Tunnel "olympus". The only way public traffic enters, outbound-only (no port forwarding).
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0011"
spec:
  interval: 10m
  path: ./04-platform/01-network/cloudflared/app
  targetNamespace: cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway
---
# Scrapes and alert rules are VictoriaMetrics CRs: they wait for the observability layer (ADR-0034).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared-monitoring
  namespace: flux-system
  annotations:
    olympus/description: Scrape and the tunnel-down alert for cloudflared.
    olympus/docs: 00-docs/runbooks/04-observability.md
    olympus/adr: "0034"
spec:
  interval: 10m
  path: ./04-platform/01-network/cloudflared/app/monitoring
  targetNamespace: cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudflared
    - name: victoria-metrics
