# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      cloudflared:
        replicas: 1 # 2 once there are 2+ nodes (ADR-0011)
        pod:
          priorityClassName: platform-critical
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
            args: [tunnel, --config, /etc/cloudflared/config.yaml, run]
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /ready, port: 2000}
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness: *probe
            resources: {requests: {cpu: 10m, memory: 128Mi}, limits: {memory: 128Mi}}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    configMaps:
      config:
        data:
          config.yaml: |
            # Locally-managed tunnel: this file is the routing (ADR-0011). Never configure it in the dashboard.
            tunnel: ${CLOUDFLARE_TUNNEL_ID}
            credentials-file: /etc/cloudflared/credentials.json
            protocol: quic
            metrics: 0.0.0.0:2000
            no-autoupdate: true
            ingress:
              - hostname: "*.${PUBLIC_DOMAIN}"
                service: http://cilium-gateway-public.gateway.svc.cluster.local
              - service: http_status:404
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
            readOnly: true
      credentials:
        type: secret
        name: cloudflared-tunnel
        globalMounts:
          - path: /etc/cloudflared/credentials.json
            subPath: credentials.json
            readOnly: true
