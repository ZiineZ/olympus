# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
  annotations:
    olympus/description: The public Gateway. Cloudflare Tunnel traffic enters the cluster here and is routed by HTTPRoutes.
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0011"
spec:
  interval: 10m
  path: ./04-platform/01-network/gateway/app
  targetNamespace: gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
