# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Group 01-network (ADR-0003). Lists its components' ks.yaml files; nothing is discovered implicitly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway-api-crds/ks.yaml
  - cilium/ks.yaml
  - gateway/ks.yaml
  - tailscale/ks.yaml
  # REHEARSAL: cloudflared and external-dns left out so public DNS is never touched (ADR-0025)
