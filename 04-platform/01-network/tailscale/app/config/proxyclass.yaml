# Every proxy the operator creates (one per tailnet Ingress/Service) gets these settings (ADR-0022).
# Changes reach *existing* proxies only when the operator next reconciles them; restarting the
# operator forces that (seen in the rehearsal, 2026-10-21).
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
spec:
  statefulSet:
    pod:
      labels:
        app.kubernetes.io/name: tailscale-proxy
      priorityClassName: platform
      tailscaleContainer:
        resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 64Mi}}
