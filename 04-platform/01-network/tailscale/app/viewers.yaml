# Humans reach the API through the operator's proxy as the group olympus:viewers (granted in
# tailnet-policy.hujson): read everything except Secrets, change nothing (ADR-0012).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olympus-viewers-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: olympus:viewers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olympus-viewers-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olympus-cluster-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: olympus:viewers
