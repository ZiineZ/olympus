# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.1
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    oauthSecretVolume: # our Secret name instead of the chart default "operator-oauth" (ADR-0002)
      secret:
        secretName: tailscale-operator-oauth
    operatorConfig:
      image:
        digest: sha256:38351d6333edc490a832b27b244665d40f4a5fe1765ade76af2264c99dbbfe0e # tailscale/k8s-operator v1.104.1
      podLabels:
        app.kubernetes.io/name: tailscale-operator
      hostname: olympus-k8s${TS_HOST_SUFFIX} # kubectl: https://olympus-k8s.<tailnet>.ts.net
      defaultTags: [tag:k8s-operator]
      priorityClassName: platform-critical
      resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 128Mi}}
    proxyConfig:
      image:
        digest: sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d # tailscale/tailscale v1.104.1
      defaultTags: tag:k8s
      defaultProxyClass: default # ./config/proxyclass.yaml
    apiServerProxyConfig: # in-process, auth mode: tailnet identity -> Kubernetes groups via grants (ADR-0012)
      mode: "true"
      allowImpersonation: "true"
