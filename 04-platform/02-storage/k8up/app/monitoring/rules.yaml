# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/operator.victoriametrics.com/vmrule_v1beta1.json
# From the operator's job counters (./scrape.yaml); the backup pods push nothing (ADR-0034).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: k8up
spec:
  groups:
    - name: k8up
      rules:
        - alert: BackupStale
          # only namespaces that already had a Schedule 26 h ago, so a new one gets its first day
          expr: increase(k8up_jobs_successful_counter{jobType="backup"}[26h]) == 0 and on (namespace) (k8up_schedules_gauge offset 26h) > 0
          labels: {severity: warning}
          annotations:
            summary: No backup of {{ $labels.namespace }} has succeeded in 26 hours
            description: Daily backups have stopped for this namespace. Check its Schedule and `kubectl -n k8up logs deploy/k8up`.
        - alert: BackupJobFailed
          expr: increase(k8up_jobs_failed_counter[1h]) > 0
          labels: {severity: warning}
          annotations:
            summary: A k8up {{ $labels.jobType }} job failed in {{ $labels.namespace }}
            description: Check the failed job's pod log in that namespace (label `k8up.io/type={{ $labels.jobType }}`).
