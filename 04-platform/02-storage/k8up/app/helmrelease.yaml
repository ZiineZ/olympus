# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  interval: 30m
  chart:
    spec:
      chart: k8up
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: k8up
  values:
    image:
      registry: ghcr.io
      repository: k8up-io/k8up
      tag: v2.16.0@sha256:29458113b8b676b5b48ebf25b21be5194ee9dccc887b92b8fa27f7d3dfca6f50
    k8up:
      backupImage: # the restic job image; pinned like the operator
        repository: ghcr.io/k8up-io/k8up
        tag: v2.16.0@sha256:29458113b8b676b5b48ebf25b21be5194ee9dccc887b92b8fa27f7d3dfca6f50
      timezone: Europe/Amsterdam
      envVars: # backup pods push restic's results to VMSingle's Pushgateway-compatible endpoint (ADR-0034)
        - name: BACKUP_PROMURL
          value: http://vmsingle-vm.victoria-metrics.svc.cluster.local:8428/api/v1/import/prometheus
      globalResources: # every backup/check/prune job pod (ADR-0022); restic needs headroom when pruning
        requests: {cpu: 50m, memory: 512Mi}
        limits: {memory: 512Mi}
    priorityClassName: platform
    resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 128Mi}}
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
