# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8up
  namespace: flux-system
  annotations:
    olympus/description: k8up, the backup operator. Daily restic backups of every PVC in opted-in namespaces to Cloudflare R2.
    olympus/docs: 00-docs/architecture.md,00-docs/runbooks/restore.md
    olympus/adr: "0017"
spec:
  interval: 10m
  path: ./04-platform/02-storage/k8up/app
  targetNamespace: k8up
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Scrapes and alert rules are VictoriaMetrics CRs: they wait for the observability layer (ADR-0034).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8up-monitoring
  namespace: flux-system
  annotations:
    olympus/description: Scrape and the backup alerts for k8up.
    olympus/docs: 00-docs/runbooks/04-observability.md
    olympus/adr: "0034"
spec:
  interval: 10m
  path: ./04-platform/02-storage/k8up/app/monitoring
  targetNamespace: k8up
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: k8up
    - name: victoria-metrics
