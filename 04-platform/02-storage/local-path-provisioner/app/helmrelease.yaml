# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
  values:
    image:
      repository: docker.io/rancher/local-path-provisioner
      tag: v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
    helperImage: # creates and removes volume directories; the chart default is busybox:latest
      repository: docker.io/library/busybox
      tag: 1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    storageClass:
      create: true
      name: local-path
      defaultClass: true
      reclaimPolicy: Retain # deleting a PVC (or pruning its folder) never deletes the data (ADR-0016)
      volumeBindingMode: WaitForFirstConsumer
    nodePathMap: # only the heavy node provides volumes; no default path, so a PVC can't bind on a worker
      - node: ${STORAGE_NODE}
        paths: [/var/mnt/local-path] # Talos UserVolume "local-path" on zeus (ADR-0007)
    priorityClassName: platform
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 64Mi}}
    helperPod:
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 32Mi}}
