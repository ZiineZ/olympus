# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Appends one UTC timestamp per hour to /data/heartbeat.log (keeps the last 1000 lines).
# A restore of this volume must contain a recent timestamp (runbooks/restore.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: heartbeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartbeat
    spec:
      priorityClassName: platform
      nodeSelector:
        olympus/tier: heavy
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the UID backup pods read as (03-cluster/components/backup/podconfig.yaml)
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: heartbeat
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - |
              while true; do
                date -u +%FT%TZ >> /data/heartbeat.log
                tail -n 1000 /data/heartbeat.log > /data/.tmp && mv /data/.tmp /data/heartbeat.log
                sleep 3600
              done
          resources:
            requests: {cpu: 1m, memory: 8Mi}
            limits: {memory: 8Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: heartbeat
