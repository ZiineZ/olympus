# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-canary
  namespace: flux-system
  annotations:
    olympus/description: A tiny pod that writes an hourly heartbeat to a volume, backed up daily. Proves backups work end to end, and is the restore-drill target.
    olympus/docs: 00-docs/runbooks/restore.md
    olympus/adr: "0017,0025,0032"
spec:
  interval: 10m
  path: ./04-platform/02-storage/backup-canary/app
  targetNamespace: backup-canary
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: k8up
    - name: local-path-provisioner
