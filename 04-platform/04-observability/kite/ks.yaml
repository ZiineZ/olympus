# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kite
  namespace: flux-system
  annotations:
    olympus/description: Kite, the cluster dashboard. Config-file mode and a read-only ServiceAccount, so it watches but never changes anything.
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0020,0033"
spec:
  interval: 10m
  path: ./04-platform/04-observability/kite/app
  targetNamespace: kite
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: victoria-metrics
    - name: k8up
