# Kite sees what a viewer sees: everything except Secrets, and changes nothing (ADR-0020).
# Edit buttons in its UI therefore fail by design; the Helm-release view (it reads Secrets) stays empty.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite-view
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {kind: ServiceAccount, name: kite, namespace: kite}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite-cluster-read
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: olympus-cluster-read}
subjects:
  - {kind: ServiceAccount, name: kite, namespace: kite}
