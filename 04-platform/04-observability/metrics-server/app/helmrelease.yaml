# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  values:
    args:
      # Talos kubelets serve self-signed certificates; traffic stays inside the cluster (ADR-0033)
      - --kubelet-insecure-tls
    resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 128Mi}}
