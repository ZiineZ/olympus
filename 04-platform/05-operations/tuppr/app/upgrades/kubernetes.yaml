# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
# The Kubernetes version the cluster should run. Change it together with kubernetesVersion in 01-talos/cluster.yaml
# (check versions-match); one minor at a time, and only after any pending Talos upgrade (ADR-0023).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
  namespace: tuppr
spec:
  kubernetes:
    # renovate: datasource=github-releases depName=kubernetes/kubernetes
    version: v1.36.5
  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      tag: v1.14.4@sha256:b3233234327350f20ed194f3fad83d90a64344c1940f839c7b0c0abef50c8c33
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 10m
