# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Athena can reach Anthropic, GitHub, the API server, VMSingle and Hubble Relay, and nothing else.
# Nothing can reach Athena: exec travels through the API server (ADR-0024 rules 13-14).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: athena-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: athena
  ingress:
    - {} # an empty rule allows nothing: default deny
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}] # Cilium's DNS proxy learns the IPs behind toFQDNs
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: victoria-metrics, app.kubernetes.io/name: vmsingle}
      toPorts:
        - ports: [{port: "8428", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: hubble-relay}
      toPorts:
        - ports: [{port: "4245", protocol: TCP}]
