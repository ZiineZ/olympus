# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: athena
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      athena:
        strategy: Recreate # RWO home volume
        serviceAccount:
          name: athena # ./rbac.yaml
        pod:
          priorityClassName: agent
          automountServiceAccountToken: true # app-template's default is off; kubectl needs it
          hostUsers: false
          nodeSelector:
            olympus/tier: heavy
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # also the backup pods' UID (03-cluster/components/backup)
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          app:
            image:
              repository: ghcr.io/ziinez/athena
              tag: d6b431ea0be080f651e8e3a12cbd3754f1148b20@sha256:5ff7ed66e5038aabafa439fd23b6410697e70963d139d9e7da50ddafcfe801ef
            env:
              ANTHROPIC_MODEL: claude-opus-5-5
              ATHENA_REPO: ZiineZ/olympus
              ATHENA_GITHUB_APP_ID: "5423524" # not secret: the private key is what grants access
              # No Claude token here: Remote Control needs a full claude.ai login, made once with athena-setup
              # and kept on the athena-home volume (ADR-0036)
            # A runaway session is OOMKilled inside this limit instead of starving the node (ADR-0024 rule 2)
            resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {memory: 2Gi}}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    persistence:
      home:
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        suffix: home # PVC athena-home (ADR-0024 rule 3)
        globalMounts:
          - path: /home/athena
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      github-app:
        type: secret
        name: athena-github-app
        defaultMode: 0440 # readable through fsGroup
        globalMounts:
          - path: /var/run/secrets/athena-github-app
            readOnly: true
