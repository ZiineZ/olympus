# Pinned toolchain and the only imperative entrypoints (ADR-0006). Renovate bumps versions.
# A tool joins in the phase that first needs it; `mise tasks` lists what exists today.

[settings]
lockfile = true # .config/mise.lock pins per-platform URLs + checksums

[env]
# One key location on macOS and Linux. The file exists only on Stan's machines (ADR-0014).
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"

[tools]
# repo checks (CI installs only these)
python = "3.14.8"
yq = "4.54.1"
# GitHub settings as code
gh = "2.102.1"
# nodes (ADR-0007): talosctl must match the Talos version in 01-talos/cluster.yaml
talosctl = "1.14.4"
# cluster (ADR-0008): kubectl within one minor of the cluster
kubectl = "1.36.5"
flux2 = "2.9.6"
helm = "4.3.1"
helmfile = "1.8.2"
kustomize = "5.8.3"
kubeconform = "0.8.0"
# secrets (ADR-0014)
sops = "3.13.3"
age = "1.3.2"
# network + watching (ADR-0010)
cilium-cli = "0.20.1"
cilium-hubble = "1.20.2"
k9s = "0.51.0"

[tasks.check]
description = "Repo checks (ADR-0004). Same as CI on push."
run = "python3 .github/checks/check.py"

[tasks."check:pr"]
description = "Repo + PR checks: sync rules, PR title. Needs BASE_REF, PR_TITLE, PR_BODY."
run = "python3 .github/checks/check.py --pr"

[tasks."secret:new"]
description = "Create or replace an encrypted Secret: values are typed hidden (or read from a file), never written in plaintext (ADR-0014)."
usage = '''
arg "<file>" help="Target path in the repo, ending in .sops.yaml"
arg "<namespace>" help="Namespace of the Secret"
arg "<name>" help="Secret name: <component>-<purpose>"
arg "<keys>" var=#true help="KEY to type hidden, or KEY=@path to read a file"
'''
shell = "bash -c"
run = '''
set -euo pipefail # bash 3.2 compatible (macOS)
file="$usage_file"
[[ "$file" == *.sops.yaml ]] || { echo "error: $file must end in .sops.yaml" >&2; exit 1; }
doc=$(NAME="$usage_name" NS="$usage_namespace" yq -n \
  '.apiVersion = "v1" | .kind = "Secret" | .type = "Opaque" | .metadata.name = strenv(NAME) | .metadata.namespace = strenv(NS)')
eval "keys=($usage_keys)" # mise passes the list shell-quoted
for key in "${keys[@]}"; do
  if [[ "$key" == *=@* ]]; then
    value=$(cat "${key#*=@}"); key="${key%%=@*}"
  else
    read -rsp "$key (hidden): " value </dev/tty; echo >&2
  fi
  [[ -n "$value" ]] || { echo "error: $key is empty" >&2; exit 1; }
  # the value travels only through memory and an env var, never argv or disk
  doc=$(printf '%s\n' "$doc" | K="$key" V="$value" yq '.stringData[strenv(K)] = strenv(V)') # a pipe, not <<< (bash 3.2 writes here-strings to a temp file)
done
mkdir -p "$(dirname "$file")"
printf '%s\n' "$doc" | sops encrypt --filename-override "$file" --input-type yaml --output-type yaml /dev/stdin > "$file.tmp"
mv "$file.tmp" "$file"
unset value doc
echo "encrypted $file for $(yq '.sops.age[0].recipient' "$file")"
'''

[tasks."github:apply"]
description = "Apply .github/settings/ to the GitHub repo (Stan, admin token)."
run = "python3 .github/settings/apply.py apply"

[tasks."github:diff"]
description = "Show drift between .github/settings/ and the live GitHub repo."
run = "python3 .github/settings/apply.py diff"

[tasks."bootstrap:apps"]
description = "Install Cilium + Flux on a fresh cluster so Flux can take over (ADR-0015). Needs KUBECONFIG and the age key."
shell = "bash -c"
run = '''
set -euo pipefail
test -f "$SOPS_AGE_KEY_FILE" || { echo "age key not found at $SOPS_AGE_KEY_FILE" >&2; exit 1; }
kubectl get namespace flux-system >/dev/null 2>&1 || kubectl create namespace flux-system
kubectl -n flux-system create secret generic sops-age --from-file=age.agekey="$SOPS_AGE_KEY_FILE" \
  --dry-run=client -o yaml | kubectl apply --server-side -f -
kubectl apply --server-side -f 03-cluster/priority-classes.yaml # Cilium pods reference them; Flux adopts them
kubectl apply --server-side -k 04-platform/01-network/gateway-api-crds/app
helmfile --file 02-bootstrap/helmfile.yaml.gotmpl sync
'''

[tasks."talos:secrets"]
description = "Once per cluster: generate the Talos secrets bundle straight into 01-talos/secrets.sops.yaml (ADR-0028)."
shell = "bash -c"
run = '''
set -euo pipefail
f=01-talos/secrets.sops.yaml
[[ ! -e $f ]] || { echo "error: $f exists; it is generated once per cluster" >&2; exit 1; }
talosctl gen secrets -o - | sops encrypt --filename-override "$f" --input-type yaml --output-type yaml /dev/stdin > "$f.tmp"
mv "$f.tmp" "$f"
echo "encrypted $f"
'''

[tasks."talos:render"]
description = "Render one node's config and the talosconfig into 01-talos/clusterconfig/ (git-ignored: it holds secrets) (ADR-0028)."
usage = 'arg "<node>" help="Node name from 01-talos/cluster.yaml"'
shell = "bash -c"
run = '''
set -euo pipefail
umask 077 # the rendered files hold the cluster's secrets
cfg=01-talos/cluster.yaml out=01-talos/clusterconfig
export N="$usage_node"
n='.nodes[] | select(.name == strenv(N))'
yq -e "$n" "$cfg" >/dev/null 2>&1 || { echo "error: no node '$N' in $cfg" >&2; exit 1; }
q() { yq -e "$1" "$cfg"; }
role=$(q "$n | .role") ip=$(q "$n | .ip") mac=$(q "$n | .mac") disk=$(q "$n | .installDisk") schematic=$(q "$n | .schematic")
[[ $mac =~ ^([0-9a-f]{2}:){5}[0-9a-f]{2}$ ]] || {
  echo "error: set mac for $N in $cfg (lowercase), from the live boot: talosctl get links --insecure -n <address>" >&2; exit 1; }
talos=$(q .talosVersion) k8s=$(q .kubernetesVersion) endpoint=$(q .endpoint)
vip=$(printf '%s' "$endpoint" | sed -E 's#^https://([^:/]+).*#\1#')
# the installer for this node's extensions and kernel args, from the Image Factory
id=$(curl -fsS -X POST --data-binary "@01-talos/schematics/$schematic.yaml" https://factory.talos.dev/schematics | yq -p json -e .id)

mkdir -p "$out"
node_patch="$out/.$N-node.yaml"
trap 'rm -f "$node_patch"' EXIT
{ # the node's own documents, from its cluster.yaml entry (ADR-0028 rule 5)
  printf 'apiVersion: v1alpha1\nkind: HostnameConfig\nhostname: %s\nauto: off\n' "$N"
  printf -- '---\napiVersion: v1alpha1\nkind: LinkAliasConfig\nname: lan\nselector:\n  match: mac(link.permanent_addr) == "%s"\n' "$mac"
  printf -- '---\napiVersion: v1alpha1\nkind: LinkConfig\nname: lan\naddresses:\n  - address: %s/%s\nroutes:\n  - gateway: %s\n' \
    "$ip" "$(q .network.prefix)" "$(q .network.gateway)"
  printf -- '---\napiVersion: v1alpha1\nkind: ResolverConfig\nnameservers:\n'
  q '.network.nameservers[]' | sed 's/^/  - address: /'
  if [[ $role == controlplane ]]; then
    printf -- '---\napiVersion: v1alpha1\nkind: Layer2VIPConfig\nname: %s\nlink: lan\n' "$vip"
  fi
  # Talos 1.14 moved install settings into UnattendedInstallConfig; gen config sets its installer image
  printf -- '---\napiVersion: v1alpha1\nkind: UnattendedInstallConfig\nprovisioning:\n  diskSelector:\n    match: disk.transport == "%s"\n' "$disk"
} > "$node_patch"

# role patches must use the role flag: plain --config-patch also patches the other role's config
flag=--config-patch-control-plane; [[ $role == worker ]] && flag=--config-patch-worker
args=()
for f in 01-talos/patches/global/*.yaml; do args+=(--config-patch "@$f"); done
for f in 01-talos/patches/"$role"/*.yaml 01-talos/patches/metal/"$role"/*.yaml; do
  if [[ -e $f ]]; then args+=("$flag" "@$f"); fi
done
args+=("$flag" "@$node_patch")
secrets="$out/.secrets.yaml"
trap 'rm -f "$node_patch" "$secrets"' EXIT
sops decrypt 01-talos/secrets.sops.yaml > "$secrets" # git-ignored folder, mode 600; removed on exit
talosctl gen config olympus "$endpoint" --with-secrets "$secrets" --force \
  --kubernetes-version "${k8s#v}" --install-image "factory.talos.dev/metal-installer/$id:$talos" \
  --output-types "$role" --output "$out/$N.yaml" "${args[@]}"
talosctl validate --mode metal --config "$out/$N.yaml"
talosctl gen config olympus "$endpoint" --with-secrets "$secrets" --force --output-types talosconfig --output "$out/talosconfig"
talosctl --talosconfig "$out/talosconfig" config endpoint $(yq '.nodes[] | select(.role == "controlplane") | .ip' "$cfg")
echo "rendered $out/$N.yaml (installer $id:$talos)"
'''

[tasks."talos:apply"]
description = "Apply a rendered node config (ADR-0028). --insecure <address> for the first apply to a node booted from the ISO; --dry-run shows the diff."
usage = '''
arg "<node>" help="Node name from 01-talos/cluster.yaml"
flag "--insecure <address>" help="first apply: the node's maintenance-mode address, shown on its console"
flag "--dry-run" help="show what would change, apply nothing"
'''
shell = "bash -c"
run = '''
set -euo pipefail
out=01-talos/clusterconfig
[[ -f $out/$usage_node.yaml ]] || { echo "error: run mise run talos:render $usage_node first" >&2; exit 1; }
ip=$(N="$usage_node" yq -e '.nodes[] | select(.name == strenv(N)) | .ip' 01-talos/cluster.yaml)
args=(--talosconfig "$out/talosconfig" apply-config --file "$out/$usage_node.yaml")
if [[ -n ${usage_insecure:-} ]]; then args+=(--insecure --nodes "$usage_insecure"); else args+=(--nodes "$ip"); fi
if [[ ${usage_dry_run:-false} == true ]]; then args+=(--dry-run); fi
talosctl "${args[@]}"
'''

[tasks."talos:bootstrap"]
description = "Once per cluster, after the first control plane installed: start etcd and fetch the admin kubeconfig (ADR-0015, ADR-0028)."
shell = "bash -c"
run = '''
set -euo pipefail
umask 077 # the admin kubeconfig
out=01-talos/clusterconfig
ip=$(yq -e '[.nodes[] | select(.role == "controlplane")][0].ip' 01-talos/cluster.yaml)
talosctl --talosconfig "$out/talosconfig" --nodes "$ip" bootstrap
talosctl --talosconfig "$out/talosconfig" --nodes "$ip" kubeconfig "$out/kubeconfig" --force
echo "next: export KUBECONFIG=$PWD/$out/kubeconfig TALOSCONFIG=$PWD/$out/talosconfig, then runbook 02"
'''

[tasks."rehearsal:up"]
description = "Throwaway Talos cluster in Docker/OrbStack (ADR-0025). Run only on Stan's go."
shell = "bash -c"
run = '''
set -euo pipefail
# OrbStack keeps its socket in ~/.orbstack when /var/run/docker.sock is absent (e.g. after a reboot)
[[ -n ${DOCKER_HOST:-} || -S /var/run/docker.sock ]] || export DOCKER_HOST="unix://$HOME/.orbstack/run/docker.sock"
cfg=01-talos/cluster.yaml
mkdir -p .rehearsal
export TALOSCONFIG="$PWD/.rehearsal/talosconfig" KUBECONFIG="$PWD/.rehearsal/kubeconfig"
args=()
for f in 01-talos/patches/global/*.yaml; do args+=(--config-patch "@$f"); done
for f in 01-talos/patches/controlplane/*.yaml; do args+=(--config-patch-controlplanes "@$f"); done
for f in 01-talos/patches/worker/*.yaml; do args+=(--config-patch-workers "@$f"); done
for f in 01-talos/patches/rehearsal/*.yaml; do args+=(--config-patch-controlplanes "@$f"); done # Docker-only stand-ins
talosctl cluster create docker \
  --name olympus-rehearsal --state "$PWD/.rehearsal/state" \
  --image "ghcr.io/siderolabs/talos:$(yq .talosVersion "$cfg")" \
  --kubernetes-version "$(yq .kubernetesVersion "$cfg" | sed 's/^v//')" \
  --workers 0 --cpus-controlplanes 6 --memory-controlplanes 10GiB \
  --host-ip 127.0.0.1 --talosconfig-destination "$TALOSCONFIG" \
  "${args[@]}"
'''

[tasks."rehearsal:down"]
description = "Destroy the rehearsal cluster and its local state (ADR-0025)."
shell = "bash -c"
run = '''
set -euo pipefail
# OrbStack keeps its socket in ~/.orbstack when /var/run/docker.sock is absent (e.g. after a reboot)
[[ -n ${DOCKER_HOST:-} || -S /var/run/docker.sock ]] || export DOCKER_HOST="unix://$HOME/.orbstack/run/docker.sock"
TALOSCONFIG="$PWD/.rehearsal/talosconfig" talosctl cluster destroy --name olympus-rehearsal --state "$PWD/.rehearsal/state"
rm -rf .rehearsal
'''
