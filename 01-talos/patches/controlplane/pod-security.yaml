# Cluster-scoped documents: Talos 1.14 allows these on control-plane machines only.
# Cluster-wide Pod Security default is `restricted` (ADR-0021). Namespaces that need less say so
# with a label in their namespace.yaml; every exception is listed in 00-docs/conventions.md.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  kind: PodSecurityConfiguration
  defaults:
    enforce: restricted
    enforce-version: latest
    audit: restricted
    audit-version: latest
    warn: restricted
    warn-version: latest
  exemptions:
    namespaces: [kube-system]
