# Eviction order under pressure: agent first, then apps, then platform (ADR-0022, ADR-0029).
# Flux and Cilium use the built-in system-*-critical classes, which exist before Flux does.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 100000
description: Ingress path and remote access (cloudflared, tailscale operator).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform
value: 10000
description: Shared platform components (observability, Kite, k8up, external-dns, ...).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apps
value: 1000
globalDefault: true
description: Default for every workload that sets no class.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agent
value: 100
preemptionPolicy: Never
description: Athena. Evicted first, never preempts anything.
