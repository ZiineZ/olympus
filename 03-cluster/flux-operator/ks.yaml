# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
  annotations:
    olympus/description: The Flux Operator, which installs, upgrades and serves the web UI for Flux itself.
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0013,0015"
spec:
  interval: 10m
  path: ./03-cluster/flux-operator/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
