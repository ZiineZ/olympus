# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
# The ONLY place for values shared across components (ADR-0004). Manifests use them as ${VAR}
# via Flux postBuild substitution. A variable joins when its first user does; the `substitutions`
# check fails on a variable that is undefined or unused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  LB_POOL_START: 192.168.50.200 # Cilium LoadBalancer pool (ADR-0009)
  LB_POOL_END: 192.168.50.229
  PUBLIC_DOMAIN: stantheunissen.nl # public apex, served through Cloudflare (ADR-0011)
  CLOUDFLARE_TUNNEL_ID: b5aa802d-2992-47a0-9205-36dcc7694caf # tunnel "olympus"; not a secret
  TS_HOST_SUFFIX: "" # tailnet hostnames; "-rehearsal" on the rehearsal cluster (ADR-0025)
