# Applied by 03-cluster/kustomization.yaml to every `layer-*` Kustomization (ADR-0029): each layer
# then patches the component Kustomizations it creates, and those patch every HelmRelease they create.
# Components therefore never repeat these fields. Values are calibration knobs, tuned by PR.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: _ # ignored: the target selects
spec:
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          retryInterval: 2m
          timeout: 5m
          wait: true
          deletionPolicy: WaitForTermination
          decryption: # opt in to SOPS: the controller only holds the key (--sops-age-secret), ADR-0030
            provider: sops
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: enabled
                  install:
                    crds: CreateReplace
                    remediation:
                      retries: 3
                  upgrade:
                    crds: CreateReplace
                    cleanupOnFail: true
                    remediation:
                      retries: 3
                      strategy: rollback
                  rollback:
                    cleanupOnFail: true
