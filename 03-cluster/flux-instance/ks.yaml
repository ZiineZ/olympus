# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
  annotations:
    olympus/description: The FluxInstance that runs Flux and syncs this repository.
    olympus/docs: 00-docs/architecture.md
    olympus/adr: "0013,0015,0029"
spec:
  interval: 10m
  path: ./03-cluster/flux-instance/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-operator
