# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Values are inline and read by the bootstrap too (ADR-0029). This component sits outside the
# layers, so it states the uniform HelmRelease settings itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-instance
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    instance:
      distribution:
        version: 2.9.6
        registry: ghcr.io/fluxcd
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.61.0 # pinned: the chart default is :latest
      components: # no image automation: Renovate is the only version writer (ADR-0001)
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      cluster:
        type: kubernetes
        domain: cluster.local
        networkPolicy: true
        multitenant: false
      sync:
        kind: GitRepository
        url: https://github.com/ZiineZ/olympus.git # public repo: no credentials (ADR-0027)
        ref: refs/heads/main
        path: 03-cluster
        interval: 1m
      kustomize:
        patches: # these patch the Flux controllers themselves, not our Kustomizations
          - target:
              kind: Deployment
              name: kustomize-controller
            patch: | # decrypt every SOPS file with the age key from bootstrap (ADR-0014)
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
          - target:
              kind: Deployment
              name: (kustomize-controller|helm-controller)
            patch: | # react to changed ConfigMaps/Secrets referenced by Kustomizations and HelmReleases
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
          - target:
              kind: Deployment
              name: (source-controller|kustomize-controller|helm-controller|notification-controller)
            patch: | # priority, and memory request = limit with no CPU limit (ADR-0022); calibration knob
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    priorityClassName: system-cluster-critical
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 100m
                            memory: 512Mi
                          limits:
                            cpu: null
                            memory: 512Mi
