# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Tailnet policy as code (ADR-0012): `test` on every PR that touches it, `apply` on merge to main.
name: tailnet-policy

on:
  pull_request:
    paths: [04-platform/01-network/tailscale/app/tailnet-policy.hujson, .github/workflows/tailnet-policy.yaml]
  push:
    branches: [main]
    paths: [04-platform/01-network/tailscale/app/tailnet-policy.hujson, .github/workflows/tailnet-policy.yaml]

permissions:
  contents: read

concurrency:
  group: tailnet-policy # never two applies at once
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: "-" # the tailnet the OAuth client belongs to
          policy-file: 04-platform/01-network/tailscale/app/tailnet-policy.hujson
          action: ${{ github.event_name == 'push' && 'apply' || 'test' }}
